name: CI
# IRD-011 pipeline, copied from user-service @ 410dda8 (via gateway). Differences, per IRD-011 D6 proposal:
# frontend has no unit tests yet, so the `test` job is a compile check (vite build); no sonar job
# (nothing to report coverage from); the CI overlay runs frontend alone (Vite dev server, IRD-004).
on:
  pull_request:              # PR checks test the merge result; required by "Protect main"
  push:
    branches: [main]         # post-merge run; unfiltered push + pull_request = 2 runs per commit
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # a new PR push cancels the superseded run; main runs (deploys) always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # lint and test have no needs: between them, so they run in parallel.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint   # eslint . --max-warnings 0

  test:
    # No unit tests yet (IRD-011 D6). Until they exist, "test" = the production bundle compiles.
    # Job id stays `test` so every repo exposes the same 4 required checks (IRD-011 AC-2).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'   # same as Dockerfile node:20-alpine (IRD-006), not the laptop's Node
          cache: 'npm'
      - run: npm ci
      - name: Compile check (vite build)
        run: npm run build

  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test]
    permissions:
      contents: read
      packages: write          # only this job can push to GHCR
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        # IRD-006: tag = 7-char commit SHA, never latest.
        # On pull_request GITHUB_SHA is GitHub's temporary merge commit, so that image
        # is never pushed: GHCR only ever holds tags that are real commits on main.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Third-party actions pinned to full commit SHA (tags can be re-pointed)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # PR: write the image to a tarball instead, handed to deploy as an artifact
          outputs: ${{ github.event_name == 'pull_request' && format('type=docker,dest={0}/image.tar', runner.temp) || '' }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
      packages: read           # pull the image from GHCR inside kind
    defaults:
      run:
        shell: bash            # -eo pipefail (plain run: is bash -e only)
    env:
      IMAGE: ${{ needs.build-image.outputs.image }}
      NS: blogcms
    steps:
      # Manifests live in the docs repo (IRD-007), not here.
      - uses: actions/checkout@v7
        with:
          repository: proops2026-simpleblog/docs
          path: docs

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ci-${{ github.run_id }}
          wait: 120s

      - name: Create Secrets (random values, cluster dies with the job)
        run: bash docs/k8s/create-secrets.sh   # committed as 100644 (no +x) in docs

      - name: Load the PR image into kind (never pushed)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - if: github.event_name == 'pull_request'
        run: kind load image-archive "$RUNNER_TEMP/image.tar" --name "ci-$GITHUB_RUN_ID"

      - name: Let the cluster pull from GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull -n "$NS" \
            --docker-server=ghcr.io --docker-username="$GITHUB_ACTOR" \
            --docker-password="$GHCR_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n "$NS" \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      # CI overlay = base + this commit's image, same shape as overlays/eks.
      # Only frontend runs: its probes are TCP on 5173, so no backend is needed.
      - name: Build CI overlay
        run: |
          mkdir -p docs/k8s/overlays/ci
          cat > docs/k8s/overlays/ci/kustomization.yaml <<YAML
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../../base
          images:
            - name: frontend
              newName: ${IMAGE%:*}
              newTag: "${IMAGE##*:}"
          patches:
            - target: { kind: Deployment, name: frontend }
              patch: |-
                - op: replace
                  path: /spec/template/spec/containers/0/imagePullPolicy
                  value: IfNotPresent
            - target: { kind: Deployment, name: (postgres|user-service|content-service|gateway) }
              patch: |-
                \$patch: delete
                apiVersion: apps/v1
                kind: Deployment
                metadata: { name: unused }
          YAML
          kubectl kustomize docs/k8s/overlays/ci | grep -E '^kind: Deployment|image:'

      - name: Apply manifests
        run: kubectl apply -k docs/k8s/overlays/ci

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/frontend -n "$NS" --timeout=180s

      - name: Show running image (evidence)
        run: |
          kubectl get pods -n "$NS" -o wide
          kubectl describe pod -n "$NS" -l app=frontend | grep -E '^Name:|Image:|Status:'
          kubectl get pods -n "$NS" -l app=frontend \
            -o jsonpath='{range .items[*]}{.spec.containers[0].image}{"\n"}{end}' | grep -qx "$IMAGE"

      - name: Diagnose (only on failure)
        if: failure()
        run: |
          kubectl get pods,events -n "$NS" --sort-by=.lastTimestamp || true
          kubectl describe pod -n "$NS" -l app=frontend || true
          kubectl logs -n "$NS" -l app=frontend --all-containers --tail=50 || true
